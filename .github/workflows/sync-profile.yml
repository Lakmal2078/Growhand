name: Sync GitHub profile

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  sync-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Growhand
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync profile README
        run: node scripts/sync-profile.mjs

      - name: Commit synced profile data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/profile-data.js
          git diff --cached --quiet || git commit -m "chore: sync GitHub profile README"
          git push
